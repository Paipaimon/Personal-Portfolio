<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>自动贪吃蛇</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: #333;
    }

    h1 {
        margin-bottom: 12px;
        font-size: 26px;
        font-weight: 600;
    }

    .score-board {
        display: flex;
        gap: 20px;
        margin-bottom: 14px;
        font-size: 18px;
    }

    .panel {
        background: white;
        padding: 10px 18px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    canvas {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .tip {
        margin-top: 12px;
        color: #777;
        font-size: 14px;
    }
</style>
</head>
<body>

<h1>自动版贪吃蛇</h1>

<div class="score-board">
    <div class="panel">
        当前分数：<span id="score">0</span>
    </div>
    <div class="panel">
        最佳分数：<span id="bestScore">0</span>
    </div>
</div>

<canvas id="game"></canvas>

<div class="tip">
    稳定型 AI · 自动重启 · 20×20 网格
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRID = 20; // 改成20x20
const CELL = 30;

canvas.width = GRID * CELL;
canvas.height = GRID * CELL;

const scoreEl = document.getElementById('score');
const bestScoreEl = document.getElementById('bestScore');

let bestScore = parseInt(localStorage.getItem('snake_best')) || 0;
bestScoreEl.textContent = bestScore;

let snake, food, score, alive;
let headDirection = { x: 1, y: 0 };

function initGame() {
    const mid = Math.floor(GRID / 2);

    snake = [
        {x: mid, y: mid},
        {x: mid - 1, y: mid},
        {x: mid - 2, y: mid}
    ];

    score = 0;
    alive = true;

    headDirection = { x: 1, y: 0 };

    scoreEl.textContent = score;

    spawnFood();
}

function spawnFood() {
    while (true) {
        let x = Math.floor(Math.random() * GRID);
        let y = Math.floor(Math.random() * GRID);

        let hit = snake.some(s => s.x === x && s.y === y);

        if (!hit) {
            food = {x, y};
            return;
        }
    }
}

function key(x, y) {
    return `${x},${y}`;
}

function curFromKey(k) {
    const [x, y] = k.split(',').map(Number);
    return {x, y};
}

function inBounds(x, y) {
    return x >= 0 && x < GRID && y >= 0 && y < GRID;
}

function getNeighbors(node) {
    return [
        {x: node.x + 1, y: node.y},
        {x: node.x - 1, y: node.y},
        {x: node.x, y: node.y + 1},
        {x: node.x, y: node.y - 1}
    ];
}

function bfs(start, target, body) {
    const queue = [start];
    const visited = new Set([key(start.x, start.y)]);
    const parent = new Map();

    while (queue.length) {
        const cur = queue.shift();

        if (cur.x === target.x && cur.y === target.y) {
            const path = [];
            let k = key(cur.x, cur.y);

            while (parent.has(k)) {
                path.unshift(curFromKey(k));
                k = parent.get(k);
            }

            return path;
        }

        for (const next of getNeighbors(cur)) {
            if (!inBounds(next.x, next.y)) continue;

            let blocked = body.some(
                b => b.x === next.x && b.y === next.y
            );

            if (
                blocked &&
                !(next.x === target.x && next.y === target.y)
            ) {
                continue;
            }

            const k = key(next.x, next.y);

            if (!visited.has(k)) {
                visited.add(k);
                parent.set(k, key(cur.x, cur.y));
                queue.push(next);
            }
        }
    }

    return null;
}

function safePath(path) {
    const virtualSnake = snake.map(s => ({...s}));

    for (let step of path) {
        virtualSnake.unshift(step);

        const eat =
            step.x === food.x &&
            step.y === food.y;

        if (!eat) {
            virtualSnake.pop();
        }
    }

    const head = virtualSnake[0];
    const tail = virtualSnake[virtualSnake.length - 1];

    const body = virtualSnake.slice(0, -1);

    return bfs(head, tail, body) !== null;
}

function chooseMove() {
    const head = snake[0];
    const tail = snake[snake.length - 1];
    const bodyWithoutTail = snake.slice(0, -1);

    const foodPath = bfs(head, food, bodyWithoutTail);

    if (foodPath && safePath(foodPath)) {
        return foodPath[0];
    }

    const tailPath = bfs(head, tail, bodyWithoutTail);

    if (tailPath?.length) {
        return tailPath[0];
    }

    for (const d of getNeighbors(head)) {
        if (!inBounds(d.x, d.y)) continue;

        let hit = snake.some(
            s => s.x === d.x && s.y === d.y
        );

        if (!hit) return d;
    }

    return null;
}

function update() {
    if (!alive) return;

    const next = chooseMove();

    if (!next) {
        gameOver();
        return;
    }

    const head = snake[0];

    headDirection = {
        x: next.x - head.x,
        y: next.y - head.y
    };

    snake.unshift(next);

    const eat =
        next.x === food.x &&
        next.y === food.y;

    if (eat) {
        score++;
        scoreEl.textContent = score;

        if (score > bestScore) {
            bestScore = score;
            bestScoreEl.textContent = bestScore;
            localStorage.setItem(
                'snake_best',
                bestScore
            );
        }

        spawnFood();
    } else {
        snake.pop();
    }

    const newHead = snake[0];

    for (let i = 1; i < snake.length; i++) {
        if (
            snake[i].x === newHead.x &&
            snake[i].y === newHead.y
        ) {
            gameOver();
            return;
        }
    }
}

function gameOver() {
    alive = false;

    setTimeout(() => {
        initGame();
    }, 1000);
}

function drawGrid() {
    ctx.strokeStyle = '#e9e9e9';
    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
    }
}

function drawSnakeHead(x, y) {
    const px = x * CELL;
    const py = y * CELL;

    ctx.fillStyle = '#111';

    ctx.beginPath();
    ctx.roundRect(
        px + 2,
        py + 2,
        CELL - 4,
        CELL - 4,
        8
    );
    ctx.fill();

    // 眼睛位置（方向标识）
    let eye1, eye2;

    if (headDirection.x === 1) {
        eye1 = [px + 21, py + 10];
        eye2 = [px + 21, py + 20];
    } else if (headDirection.x === -1) {
        eye1 = [px + 9, py + 10];
        eye2 = [px + 9, py + 20];
    } else if (headDirection.y === -1) {
        eye1 = [px + 10, py + 9];
        eye2 = [px + 20, py + 9];
    } else {
        eye1 = [px + 10, py + 21];
        eye2 = [px + 20, py + 21];
    }

    ctx.fillStyle = "#fff";

    for (const [ex, ey] of [eye1, eye2]) {
        ctx.beginPath();
        ctx.arc(ex, ey, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGrid();

    // 食物
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.roundRect(
        food.x * CELL + 6,
        food.y * CELL + 6,
        CELL - 12,
        CELL - 12,
        6
    );
    ctx.fill();

    snake.forEach((s, index) => {
        if (index === 0) {
            drawSnakeHead(s.x, s.y);
            return;
        }

        ctx.fillStyle = '#222';

        ctx.beginPath();
        ctx.roundRect(
            s.x * CELL + 2,
            s.y * CELL + 2,
            CELL - 4,
            CELL - 4,
            8
        );
        ctx.fill();
    });
}

function loop() {
    update();
    draw();
}

initGame();
setInterval(loop, 70);
</script>

</body>
</html>
