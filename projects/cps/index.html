<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPS Test</title>
    <style>
        :root {
            --bg: #f6f6f7;
            --surface: #ffffff;
            --area: #f2f3f5;
            --text: #1a1a1a;
            --muted: #8a8f98;
            --line: #e6e8eb;
            --accent: #2563eb;
            --accent-soft: #eaf1fe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ---------- 时间选择 ---------- */
        #switch_time {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transition: opacity .25s ease;
        }

        #switch_time.hidden {
            opacity: .35;
            pointer-events: none;
        }

        #show_time_title {
            font-size: 15px;
            color: var(--muted);
            letter-spacing: .02em;
        }

        #set_time {
            color: var(--text);
            font-weight: 600;
        }

        .segmented {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 4px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
        }

        #switch_time input[type="radio"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #switch_time label {
            padding: 8px 18px;
            border-radius: 999px;
            color: var(--muted);
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: background-color .2s ease, color .2s ease;
        }

        #switch_time label:hover {
            color: var(--text);
        }

        #switch_time input[type="radio"]:checked + label {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        /* ---------- 点击区 ---------- */
        #box {
            position: relative;
            width: min(560px, 100%);
            min-height: 52vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 40px 24px;
            background: var(--area);
            border: 1px solid var(--line);
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
            touch-action: manipulation;
            transition: background-color .2s ease, transform .08s ease;
        }

        #box:hover {
            background: #eceef1;
        }

        #box:not(.fullscreen):active,
        #box:not(.fullscreen).tap {
            transform: scale(.995);
            background: #e8eaee;
        }

        #box.running {
            background: var(--surface);
            border-color: #dfe3e8;
        }

        /* 测试进行中：点击区铺满屏幕 */
        #box.fullscreen {
            position: fixed;
            inset: 0;
            z-index: 10;
            width: 100%;
            height: 100%;
            min-height: 100%;
            padding: 0;
            border: none;
            border-radius: 0;
            animation: expand .18s ease-out;
        }

        @keyframes expand {
            from { transform: scale(.97); opacity: .5; }
            to   { transform: scale(1); opacity: 1; }
        }

        #box.fullscreen #number {
            font-size: clamp(88px, 22vw, 180px);
        }

        #box.fullscreen #show_time {
            font-size: 20px;
        }

        #box.fullscreen #title {
            opacity: 0;
        }

        body.locked {
            overflow: hidden;
        }

        body.locked footer {
            visibility: hidden;
        }

        #progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            width: 0;
            background: var(--accent);
            transition: width .08s linear;
        }

        #show_time {
            font-size: 18px;
            font-variant-numeric: tabular-nums;
            color: var(--accent);
            letter-spacing: .04em;
        }

        #show_time_font {
            font-size: 12px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #number {
            margin: 10px 0 4px;
            font-size: clamp(56px, 14vw, 88px);
            font-weight: 300;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--text);
        }

        #cps {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin: 8px 0 12px;
            font-size: 15px;
            color: var(--muted);
        }

        #cps_value {
            font-size: 20px;
            font-weight: 500;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        #cps_font {
            font-size: 11px;
            letter-spacing: .16em;
        }

        #title {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: .1em;
            color: var(--muted);
            transition: color .2s ease;
        }

        #box:hover #title {
            color: var(--text);
        }

        /* ---------- 结果 ---------- */
        #result {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(20, 22, 26, .28);
            backdrop-filter: blur(2px);
        }

        #result.show {
            display: flex;
            animation: fade .2s ease;
        }

        @keyframes fade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .result-card {
            width: min(320px, 100%);
            padding: 36px 28px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .12);
        }

        .result-card .label {
            font-size: 12px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .result-card .value {
            margin: 10px 0 4px;
            font-size: 52px;
            font-weight: 300;
            line-height: 1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .result-card .sub {
            font-size: 13px;
            color: var(--muted);
        }

        .result-card button {
            margin-top: 24px;
            width: 100%;
            padding: 11px 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--text);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: opacity .2s ease;
        }

        .result-card button:hover {
            opacity: .86;
        }

        footer {
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 560px) {
            #box { min-height: 46vh; border-radius: 16px; }
            #switch_time label { padding: 7px 12px; font-size: 13px; }
            .segmented { border-radius: 18px; }
        }
    </style>
</head>
<body>
    <div id="switch_time">
        <div id="show_time_title"><span id="set_time">10</span> 秒钟要点击的速度</div>
        <div class="segmented">
            <input type="radio" name="switchTime" id="1s" onclick="setTime1s()"><label for="1s">1 S</label>
            <input type="radio" name="switchTime" id="2s" onclick="setTime2s()"><label for="2s">2 S</label>
            <input type="radio" name="switchTime" id="5s" onclick="setTime5s()"><label for="5s">5 S</label>
            <input type="radio" name="switchTime" id="10s" onclick="setTime10s()" checked><label for="10s">10 S</label>
            <input type="radio" name="switchTime" id="30s" onclick="setTime30s()"><label for="30s">30 S</label>
            <input type="radio" name="switchTime" id="60s" onclick="setTime60s()"><label for="60s">60 S</label>
        </div>
    </div>

    <div id="box" onclick="clicked()">
        <div id="progress"></div>
        <div id="show_time">0.00</div>
        <div id="show_time_font">Second</div>
        <div id="number">0</div>
        <div id="cps" title="最近 1 秒的平均点击速度"><span id="cps_value">0.00</span><span id="cps_font">CPS</span></div>
        <div id="title">Click Here</div>
    </div>

    <footer>左键 / 右键 / 空格键均可点击 · 长按无效</footer>

    <div id="result">
        <div class="result-card">
            <div class="label">CPS</div>
            <div class="value" id="result_value">0.00</div>
            <div class="sub" id="result_sub"></div>
            <button onclick="reset()">再来一次</button>
        </div>
    </div>

    <script>
        let number = 0;      // 点击次数
        let setTime = 10;    // 设定秒数
        let startTime = 0;   // 起始时间戳
        let running = false;
        let endTimer = 0;
        let rafId = 0;
        let clickTimes = [];  // 最近若干次点击的时间戳，用于估算瞬时速度
        const RATE_SAMPLE = 5;    // 取最近几次点击的间隔估算速度
        const SMOOTH_TAU = 260;   // 平滑时间常数(ms)，越大越稳、越小越灵敏
        const IDLE_MS = 400;      // 超过这么久没点击，瞬时速度按 0 处理（数值自然回落）
        const MAX_SAMPLES = 24;   // 时间戳最多保留多少个
        let smoothCps = 0;        // 平滑后的实时 CPS
        let lastTickTime = 0;

        const $ = id => document.getElementById(id);

        function updateSetTime(sec) {
            if (running) return;
            setTime = sec;
            $('set_time').innerText = sec;
        }

        function setTime1s()  { updateSetTime(1); }
        function setTime2s()  { updateSetTime(2); }
        function setTime5s()  { updateSetTime(5); }
        function setTime10s() { updateSetTime(10); }

        function setTime30s() { updateSetTime(30); }

        function setTime60s() { updateSetTime(60); }

        function clicked() {
            if (!running) {
                running = true;
                number = 0;
                clickTimes = [];
                smoothCps = 0;
                lastTickTime = 0;
                startTime = performance.now();
                $('box').classList.add('running', 'fullscreen');
                document.body.classList.add('locked');
                $('switch_time').classList.add('hidden');
                $('title').innerText = 'Clicking…';
                endTimer = setTimeout(judge, setTime * 1000);
                rafId = requestAnimationFrame(tick);
            }
            number++;
            clickTimes.push(performance.now());
            if (clickTimes.length > MAX_SAMPLES) clickTimes.shift();
            $('number').innerText = number;
        }

        function tick() {
            const now = performance.now();
            const elapsed = Math.min(now - startTime, setTime * 1000);
            $('show_time').innerText = (elapsed / 1000).toFixed(2);
            $('progress').style.width = (elapsed / (setTime * 1000) * 100) + '%';

            const dt = lastTickTime ? Math.min(now - lastTickTime, 200) : 16;
            lastTickTime = now;
            // 指数平滑：瞬时速度 -> 平滑值，避免每次点击硬跳 1.00
            smoothCps += (rawCps(now) - smoothCps) * (1 - Math.exp(-dt / SMOOTH_TAU));
            $('cps_value').innerText = smoothCps.toFixed(2);

            if (running) rafId = requestAnimationFrame(tick);
        }

        // 瞬时速度：用最近几次点击的平均间隔反推每秒次数（间隔是连续量，天然带小数）
        function rawCps(now) {
            if (clickTimes.length < 2) return 0;
            // 停手超过 IDLE_MS 视为速度为 0，数值会平滑回落而不是卡在旧值
            if (now - clickTimes[clickTimes.length - 1] > IDLE_MS) return 0;
            const from = Math.max(0, clickTimes.length - RATE_SAMPLE);
            const span = clickTimes[clickTimes.length - 1] - clickTimes[from];
            const gaps = clickTimes.length - 1 - from; // 间隔个数
            return span > 0 ? gaps / (span / 1000) : 0;
        }

        function judge() {
            running = false;
            cancelAnimationFrame(rafId);
            const cps = number / setTime;
            $('result_value').innerText = cps.toFixed(2);
            $('result_sub').innerText = setTime + ' 秒内点击 ' + number + ' 次';
            $('result').classList.add('show');
            $('title').innerText = 'Click Here';
            // 移开焦点，防止空格误触发结果页按钮
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        }

        function reset() {
            clearTimeout(endTimer);
            $('result').classList.remove('show');
            $('box').classList.remove('running', 'fullscreen');
            document.body.classList.remove('locked');
            $('switch_time').classList.remove('hidden');
            $('progress').style.width = '0';
            $('show_time').innerText = '0.00';
            $('cps_value').innerText = '0.00';
            $('number').innerText = '0';
            number = 0;
            clickTimes = [];
            smoothCps = 0;
            lastTickTime = 0;
            running = false;
        }

        // 禁用右键菜单，右键同样计一次点击
        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            if ($('result').classList.contains('show')) return;
            // 未开测时，只有点在点击区内才开始计时，避免误触时长选择区
            if (!running && !$('box').contains(e.target)) return;
            clicked();
        });
        // 键盘计数：长按不重复计分，测试结束后空格不再触发“再来一次”
        let keyHeld = false;

        document.addEventListener('keydown', e => {
            if (e.code !== 'Space' && e.key !== 'Enter') return;
            e.preventDefault();                 // 阻止空格滚动页面 / 触发按钮默认行为
            if (e.repeat || keyHeld) return;     // 系统自动重复、或未松手再按，都不计分
            keyHeld = true;
            if ($('result').classList.contains('show')) return; // 结果页空格失效，需手动点按钮
            const box = $('box');
            box.classList.add('tap');
            setTimeout(() => box.classList.remove('tap'), 80);
            clicked();
        });

        document.addEventListener('keyup', e => {
            if (e.code === 'Space' || e.key === 'Enter') keyHeld = false;
        });

        // 失焦时补一次复位，避免 keyup 丢失导致按键状态卡死
        window.addEventListener('blur', () => { keyHeld = false; });
    </script>
</body>
</html>
